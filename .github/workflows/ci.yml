name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

# A newer commit on the same ref makes the older run's result obsolete: it can
# only ever report on code nobody will merge, while holding runner capacity the
# current commit is waiting for. Superseded runs are therefore cancelled — but
# never on the trunk, where every commit's result is a record worth keeping and
# nothing supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --exclude-no-default-features
    - name: Clippy featureless tributaries
      # The blanket --exclude-no-default-features above never builds the FEATURELESS
      # umbrella (the generic core: no fs, no runtime); pin it explicitly here.
      run: cargo clippy -p tributaries --no-default-features -- -D warnings

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install mingw (windows-gnu)
        # windows-sys emits import libraries through the target's dlltool on
        # BOTH gnu flavors.
        if: contains(matrix.target, 'windows-gnu')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset --exclude-no-default-features

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # The macOS leg runs the real-FSEvents integration suites (tributary-fs's
    # `watcher` and tributaries' unprivileged `umbrella`); a wedged kernel stream
    # must fail the job, not idle out the runner.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      # `_integration` gates the privileged, single-threaded Linux integration
      # suites (see tributary-fs/Cargo.toml); this parallel powerset run must not
      # build or run them — the `linux-integration` job owns them.
      run: cargo hack test --feature-powerset --exclude-no-default-features --exclude-features _integration
    - name: Check featureless tributaries
      # The blanket --exclude-no-default-features above never builds the FEATURELESS
      # umbrella (the generic core: no fs, no runtime); pin it explicitly here.
      run: cargo check -p tributaries --no-default-features
    - name: Test fs-off custom-source suite
      # The #20 regression pin: `indexer_shaped` binds its own Source over the
      # `tributary-fs` DEV-dependency and must compile and run with the umbrella's
      # `fs` feature OFF (its test target requires only `tokio`). The powerset above
      # covers this combo implicitly; this explicit leg keeps it from vanishing if
      # the matrix flags ever change.
      run: cargo test -p tributaries --no-default-features --features tokio --test indexer_shaped

  linux-integration:
    name: linux-integration
    runs-on: ubuntu-latest
    # Real-inotify convergence suites; a wedged kernel queue must fail the
    # job, not idle out the runner.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-linux-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-linux-integration-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Integration (unprivileged)
      # The privileged cells self-probe and skip loudly here. Single-threaded
      # by the suite's contract (the sysctl cells shrink namespace-global
      # inotify limits).
      run: cargo test -p tributary-fs --all-features --test linux_inotify -- --test-threads=1
    - name: Integration (privileged)
      # sudo unlocks the sysctl overflow/watch-limit cells and the bind-mount
      # aliasing cell; the tests snapshot and restore every knob they touch.
      run: sudo -E env "PATH=$PATH" cargo test -p tributary-fs --all-features --test linux_inotify -- --test-threads=1

  windows-integration:
    name: windows-integration
    strategy:
      fail-fast: false
      matrix:
        os:
          # Pinned labels: windows-latest re-points across image migrations,
          # and the integration matrix is exactly the support claim.
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    # Real-RDCW suites; a wedged completion port must fail the job, not idle
    # out the runner.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-windows-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.os }}-windows-integration-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Build the volume zoo
      run: pwsh ci/windows/zoo.ps1 -Root "$env:RUNNER_TEMP\zoo"
    - name: Integration
      # Single-threaded by the suite's contract (root-death and overflow
      # cells own their scratch trees; serialization keeps kernel-buffer
      # pressure deterministic).
      run: cargo test -p tributary-fs --all-features --test windows_rdcw -- --test-threads=1

  sanitizer:
    name: sanitizer-${{ matrix.which }}
    strategy:
      fail-fast: false
      matrix:
        which: [asan-lsan, msan, tsan]
        # TSan's stop-the-world instrumentation slows the runtime far more than
        # ASan/LSan/MSan, so its real-kernel timing cells (notably the
        # cross-directory move-pairing) need a larger budget than the shared
        # default to stay honest rather than flaky.
        include:
          - which: tsan
            timing_scale: 12
    runs-on: ubuntu-latest
    # A passing shard finishes in a few minutes; this bounds a pathological
    # livelock (a producer/drain cell under TSan's adversarial scheduling) to a
    # fast failure instead of the 6 h GitHub job ceiling.
    timeout-minutes: 45
    env:
      # The storm cells converge statistically over many seeds; under sanitizer
      # instrumentation the full 64-seed sweep dominates the job's runtime. The
      # sanitizers are here to find memory/thread errors, and a few seeds drive the
      # same code paths — the full sweep still runs on the native `test` legs.
      TRIBUTARY_FS_STORM_SEEDS: 8
      # The real-kernel cells' budgets are sized for native speed; sanitizer
      # instrumentation slows the runtime several fold while the producer's raw
      # syscalls keep their pace, so the kernel-event waits and the move-pairing
      # window need proportionally more room to stay honest rather than flaky.
      # TSan is the slowest instrument, so it takes a larger scale (see the
      # matrix `include`); the others use the shared default.
      TRIBUTARY_FS_TIMING_SCALE: ${{ matrix.timing_scale || 6 }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Sanitizer (${{ matrix.which }})
        run: bash ci/sanitizer.sh "${{ matrix.which }}"

  miri-tb:
    name: miri-tb-${{ matrix.target }}${{ matrix.test-group && format(' [{0}]', matrix.test-group) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every target runs the same seven-way partition, one shard per job. The
        # partition is disjoint and exhaustive over every workspace test, so the
        # shards together are exactly the single unsharded pass they replace.
        #
        # Sharding is not only about the 32-bit address space that forced it: an
        # emulated target interprets every instruction, so one process over the
        # whole workspace is long enough that a single late failure costs the whole
        # run's feedback. Uniform shards keep each job short, name the failing
        # region in the job title, and stop any one target from quietly growing
        # past a limit the others already hit.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - aarch64-apple-darwin
        test-group:
          - rest
          - proto-monitor-head
          - proto-monitor-tail
          - fs-rest
          - fs-cookie
          - fs-descending
          - fs-driver
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_tb.sh "${{ matrix.target }}" "${{ matrix.test-group }}"

  miri-sb:
    name: miri-sb-${{ matrix.target }}${{ matrix.test-group && format(' [{0}]', matrix.test-group) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every target runs the same seven-way partition, one shard per job. The
        # partition is disjoint and exhaustive over every workspace test, so the
        # shards together are exactly the single unsharded pass they replace.
        #
        # Sharding is not only about the 32-bit address space that forced it: an
        # emulated target interprets every instruction, so one process over the
        # whole workspace is long enough that a single late failure costs the whole
        # run's feedback. Uniform shards keep each job short, name the failing
        # region in the job title, and stop any one target from quietly growing
        # past a limit the others already hit.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - aarch64-apple-darwin
        test-group:
          - rest
          - proto-monitor-head
          - proto-monitor-tail
          - fs-rest
          - fs-cookie
          - fs-descending
          - fs-driver
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_sb.sh "${{ matrix.target }}" "${{ matrix.test-group }}"

  # valgrind:
  #   name: valgrind
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Cache cargo build and registry
  #       uses: actions/cache@v6
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ubuntu-latest-valgrind-
  #     - name: Install Rust
  #       run: rustup update stable && rustup default stable
  #     - name: Install Valgrind
  #       run: |
  #         sudo apt-get update -y
  #         sudo apt-get install -y valgrind
  #     # Uncomment and customize when you have binaries to test:
  #     # - name: cargo build foo
  #     #   run: cargo build --bin foo
  #     #   working-directory: integration
  #     # - name: Run valgrind foo
  #     #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
  #     #   working-directory: integration

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin --engine llvm --all-features --run-types lib --run-types tests --run-types doctests --workspace --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          # Coverage upload is advisory: a missing token or a transient upload hiccup
          # must not fail the whole CI run.
          fail_ci_if_error: false
