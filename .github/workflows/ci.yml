name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

# A newer commit on the same ref makes the older run's result obsolete: it can
# only ever report on code nobody will merge, while holding runner capacity the
# current commit is waiting for. Superseded runs are therefore cancelled — but
# never on the trunk, where every commit's result is a record worth keeping and
# nothing supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --exclude-no-default-features
    - name: Clippy featureless tributaries
      # The blanket --exclude-no-default-features above never builds the FEATURELESS
      # umbrella (the generic core: no fs, no runtime); pin it explicitly here.
      run: cargo clippy -p tributaries --no-default-features -- -D warnings

  # The advertised `rust-version` is a support claim, and every other job
  # installs the latest stable — so nothing would notice the workspace drifting
  # past its own floor. This job is that gate: pinned, never updated in place.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal --no-self-update
      - name: Assert the pin still matches the manifest
        # A raised `rust-version` against a stale pin here would leave the claim
        # ungated again, which is the hole this job exists to close.
        run: |
          declared=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')
          if [ "$declared" != "1.95" ]; then
            echo "::error::workspace rust-version is $declared but this job pins 1.95"
            exit 1
          fi
      - name: Build every target at the MSRV
        run: cargo +1.95 build --workspace --all-features --all-targets
      - name: Test at the MSRV
        # The `_integration` binaries are COMPILED by the build step above but
        # not run here: they need `--test-threads=1` and privilege, and the
        # dedicated Linux jobs own them.
        run: |
          cargo +1.95 test -p tributary-proto --all-features
          cargo +1.95 test -p tributary-fs --features tokio,smol
          cargo +1.95 test -p tributaries --features fs,tokio,smol

  # A declared dependency floor is a claim too, and never an exercised one:
  # cargo resolves the NEWEST compatible version, so a floor can sit years below
  # anything that actually compiles and no job would notice. This one resolves
  # every DIRECT dependency at its declared floor and builds there.
  minimal-versions:
    name: minimal-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly --no-self-update && rustup default nightly
      - name: Resolve every direct dependency at its floor
        # Cargo.lock is not committed, so this resolves from the manifests
        # alone and the lockfile it writes IS the assertion.
        run: cargo +nightly generate-lockfile -Z direct-minimal-versions
      - name: Show the floors that were selected
        run: cargo tree --depth 1 --locked
      - name: Build at the floors
        run: cargo +nightly check --workspace --all-features --all-targets --locked

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install mingw (windows-gnu)
        # windows-sys emits import libraries through the target's dlltool on
        # BOTH gnu flavors.
        if: contains(matrix.target, 'windows-gnu')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset --exclude-no-default-features

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # The macOS leg runs the real-FSEvents integration suites (tributary-fs's
    # `watcher` and tributaries' unprivileged `umbrella`); a wedged kernel stream
    # must fail the job, not idle out the runner.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      # `_integration` gates the privileged, single-threaded Linux integration
      # suites (see tributary-fs/Cargo.toml); this parallel powerset run must not
      # build or run them — the `linux-integration` job owns them.
      run: cargo hack test --feature-powerset --exclude-no-default-features --exclude-features _integration
    - name: Check featureless tributaries
      # The blanket --exclude-no-default-features above never builds the FEATURELESS
      # umbrella (the generic core: no fs, no runtime); pin it explicitly here.
      run: cargo check -p tributaries --no-default-features
    - name: Test fs-off custom-source suite
      # The #20 regression pin: `indexer_shaped` binds its own Source over the
      # `tributary-fs` DEV-dependency and must compile and run with the umbrella's
      # `fs` feature OFF (its test target requires only `tokio`). The powerset above
      # covers this combo implicitly; this explicit leg keeps it from vanishing if
      # the matrix flags ever change.
      run: cargo test -p tributaries --no-default-features --features tokio --test indexer_shaped

  # Every lifecycle/cancellation/close/timer contract lives in four in-crate
  # test modules whose `cfg` names `feature = "tokio"` alone, so they compile
  # out of every Smol build: a green Smol leg of the feature powerset proves
  # nothing about Smol. This job runs those modules under Smol and ACCOUNTS for
  # how many actually executed, so the gap is annotated on every run instead of
  # passing silently, and turns into a hard failure the moment the gate widens.
  smol-contracts:
    name: smol-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-smol-contracts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-smol-contracts-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Runtime contracts under smol
        run: |
          set -o pipefail
          cargo test -p tributary-fs --no-default-features --features smol --lib \
            -- driver::tests:: watcher::tests:: 2>&1 | tee fs.log
          cargo test -p tributaries --no-default-features --features fs,smol --lib \
            -- driver::tests:: demux::tests:: 2>&1 | tee umbrella.log
      - name: Account for what Smol actually executed
        run: |
          executed=$(grep -ho 'test result: ok\. [0-9]\+ passed' fs.log umbrella.log \
            | awk '{ sum += $4 } END { print sum + 0 }')
          echo "runtime-contract tests executed under smol: $executed" >> "$GITHUB_STEP_SUMMARY"
          if grep -rqF 'cfg(all(test, feature = "tokio"))' tributary-fs/src tributaries/src; then
            echo "::warning::runtime-contract suites are still cfg-gated to feature = \"tokio\"; Smol executed $executed of them"
          elif [ "$executed" -eq 0 ]; then
            echo "::error::the tokio-only cfg gate is gone yet Smol executed no runtime-contract test"
            exit 1
          fi

  linux-integration:
    name: linux-integration
    runs-on: ubuntu-latest
    # Real-inotify convergence suites; a wedged kernel queue must fail the
    # job, not idle out the runner.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-linux-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-linux-integration-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Integration (unprivileged)
      # The privileged cells self-probe and skip loudly here. Single-threaded
      # by the suite's contract (the sysctl cells shrink namespace-global
      # inotify limits).
      run: cargo test -p tributary-fs --all-features --test linux_inotify -- --test-threads=1
    - name: Integration (privileged)
      # sudo unlocks the sysctl overflow/watch-limit cells and the bind-mount
      # aliasing cell; the tests snapshot and restore every knob they touch.
      run: sudo -E env "PATH=$PATH" cargo test -p tributary-fs --all-features --test linux_inotify -- --test-threads=1

  # The fanotify backend had no hosted acceptance at all: the powerset `test`
  # job excludes `_integration`, and `linux-integration` names only the inotify
  # binary, so `linux_fanotify` was built and run nowhere.
  linux-fanotify:
    name: linux-fanotify
    runs-on: ubuntu-latest
    # Real-fanotify convergence suites over an ext4 loopback; a wedged kernel
    # queue must fail the job, not idle out the runner.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-linux-fanotify-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-linux-fanotify-
          ${{ runner.os }}-linux-integration-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Probe the ext4 loopback the privileged cells need
      # Every privileged cell builds an ext4 loopback and self-skips loudly if
      # it cannot. Proving the runner can host one BEFORE the suite runs turns
      # an image that lost loop devices into a named environment failure rather
      # than a green run in which nothing was tested.
      run: |
        set -eux
        img="$RUNNER_TEMP/loopback-probe.img"
        mnt="$RUNNER_TEMP/loopback-probe"
        dd if=/dev/zero of="$img" bs=1M count=16
        mkfs.ext4 -q -F "$img"
        mkdir -p "$mnt"
        sudo mount -o loop "$img" "$mnt"
        mountpoint -q "$mnt"
        sudo umount "$mnt"
        rm -f "$img"
    - name: Fanotify (unprivileged)
      # Default caps: the loopback cells skip here, but the Auto-probe FALLBACK
      # arm and the forced-Fanotify-without-privilege typed error are reachable
      # ONLY without CAP_SYS_ADMIN. Single-threaded by the suite's contract (the
      # cells mount and unmount a shared loopback).
      run: |
        set -o pipefail
        cargo test -p tributary-fs --all-features --test linux_fanotify \
          -- --test-threads=1 --nocapture 2>&1 | tee fanotify-unpriv.log
    - name: Fanotify (privileged)
      # sudo unlocks CAP_SYS_ADMIN and the ext4 loopback, which is what makes
      # the FID/identity, rename-pairing, superblock-filter and unmount-quiesce
      # cells run at all.
      run: |
        set -o pipefail
        sudo -E env "PATH=$PATH" cargo test -p tributary-fs --all-features \
          --test linux_fanotify -- --test-threads=1 --nocapture 2>&1 | tee fanotify-priv.log
    - name: Assert neither leg was vacuous
      # Both legs exit 0 when every cell self-skips, which is exactly the
      # silent pass this job exists to prevent: the privileged leg must not
      # skip for a missing loopback, the unprivileged leg must really lack
      # CAP_SYS_ADMIN, and both must have run tests.
      run: |
        if grep -q 'no ext4 loopback' fanotify-priv.log; then
          grep 'no ext4 loopback' fanotify-priv.log
          echo "::error::the privileged fanotify leg skipped its loopback cells"
          exit 1
        fi
        if grep -q 'has CAP_SYS_ADMIN' fanotify-unpriv.log; then
          echo "::error::the unprivileged fanotify leg ran with CAP_SYS_ADMIN"
          exit 1
        fi
        for log in fanotify-unpriv.log fanotify-priv.log; do
          if ! grep -q 'test result: ok\. [1-9][0-9]* passed' "$log"; then
            echo "::error::$log records no passing test"
            exit 1
          fi
        done

  windows-integration:
    name: windows-integration
    strategy:
      fail-fast: false
      matrix:
        os:
          # Pinned labels: windows-latest re-points across image migrations,
          # and the integration matrix is exactly the support claim.
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    # Real-RDCW suites; a wedged completion port must fail the job, not idle
    # out the runner.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-windows-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.os }}-windows-integration-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Build the volume zoo
      run: pwsh ci/windows/zoo.ps1 -Root "$env:RUNNER_TEMP\zoo"
    - name: Integration
      # Single-threaded by the suite's contract (root-death and overflow
      # cells own their scratch trees; serialization keeps kernel-buffer
      # pressure deterministic).
      run: cargo test -p tributary-fs --all-features --test windows_rdcw -- --test-threads=1

  sanitizer:
    name: sanitizer-${{ matrix.which }}
    strategy:
      fail-fast: false
      matrix:
        which: [asan-lsan, msan, tsan]
        # TSan's stop-the-world instrumentation slows the runtime far more than
        # ASan/LSan/MSan, so its real-kernel timing cells (notably the
        # cross-directory move-pairing) need a larger budget than the shared
        # default to stay honest rather than flaky.
        include:
          - which: tsan
            timing_scale: 12
    runs-on: ubuntu-latest
    # A passing shard finishes in a few minutes; this bounds a pathological
    # livelock (a producer/drain cell under TSan's adversarial scheduling) to a
    # fast failure instead of the 6 h GitHub job ceiling.
    timeout-minutes: 45
    env:
      # The storm cells converge statistically over many seeds; under sanitizer
      # instrumentation the full 64-seed sweep dominates the job's runtime. The
      # sanitizers are here to find memory/thread errors, and a few seeds drive the
      # same code paths — the full sweep still runs on the native `test` legs.
      TRIBUTARY_FS_STORM_SEEDS: 8
      # The real-kernel cells' budgets are sized for native speed; sanitizer
      # instrumentation slows the runtime several fold while the producer's raw
      # syscalls keep their pace, so the kernel-event waits and the move-pairing
      # window need proportionally more room to stay honest rather than flaky.
      # TSan is the slowest instrument, so it takes a larger scale (see the
      # matrix `include`); the others use the shared default.
      TRIBUTARY_FS_TIMING_SCALE: ${{ matrix.timing_scale || 6 }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Sanitizer (${{ matrix.which }})
        run: bash ci/sanitizer.sh "${{ matrix.which }}"

  miri-tb:
    name: miri-tb-${{ matrix.target }}${{ matrix.test-group && format(' [{0}]', matrix.test-group) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every target runs the same seven-way partition, one shard per job. The
        # partition is disjoint and exhaustive over every workspace test, so the
        # shards together are exactly the single unsharded pass they replace.
        #
        # Sharding is not only about the 32-bit address space that forced it: an
        # emulated target interprets every instruction, so one process over the
        # whole workspace is long enough that a single late failure costs the whole
        # run's feedback. Uniform shards keep each job short, name the failing
        # region in the job title, and stop any one target from quietly growing
        # past a limit the others already hit.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - aarch64-apple-darwin
        test-group:
          - rest
          - proto-monitor-head
          - proto-monitor-tail
          - fs-rest
          - fs-cookie
          - fs-descending
          - fs-driver
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_tb.sh "${{ matrix.target }}" "${{ matrix.test-group }}"

  miri-sb:
    name: miri-sb-${{ matrix.target }}${{ matrix.test-group && format(' [{0}]', matrix.test-group) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every target runs the same seven-way partition, one shard per job. The
        # partition is disjoint and exhaustive over every workspace test, so the
        # shards together are exactly the single unsharded pass they replace.
        #
        # Sharding is not only about the 32-bit address space that forced it: an
        # emulated target interprets every instruction, so one process over the
        # whole workspace is long enough that a single late failure costs the whole
        # run's feedback. Uniform shards keep each job short, name the failing
        # region in the job title, and stop any one target from quietly growing
        # past a limit the others already hit.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - aarch64-apple-darwin
        test-group:
          - rest
          - proto-monitor-head
          - proto-monitor-tail
          - fs-rest
          - fs-cookie
          - fs-descending
          - fs-driver
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_sb.sh "${{ matrix.target }}" "${{ matrix.test-group }}"

  # valgrind:
  #   name: valgrind
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Cache cargo build and registry
  #       uses: actions/cache@v6
  #       with:
  #         path: |
  #           ~/.cargo/registry
  #           ~/.cargo/git
  #           target
  #         key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
  #         restore-keys: |
  #           ubuntu-latest-valgrind-
  #     - name: Install Rust
  #       run: rustup update stable && rustup default stable
  #     - name: Install Valgrind
  #       run: |
  #         sudo apt-get update -y
  #         sudo apt-get install -y valgrind
  #     # Uncomment and customize when you have binaries to test:
  #     # - name: cargo build foo
  #     #   run: cargo build --bin foo
  #     #   working-directory: integration
  #     # - name: Run valgrind foo
  #     #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
  #     #   working-directory: integration

  # `license = "MIT OR Apache-2.0"` is a claim about the archive a consumer
  # receives, and nothing checked it: both license texts lived only at the
  # workspace root, so every packaged crate shipped with no license at all.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Package each crate and prove it carries both licenses
        # --no-verify: the members depend on each other at versions that need
        # not be published yet, and this gate is about the archive's CONTENTS.
        run: |
          set -eu
          # Asked for rather than assumed: a configured `target-dir` would move
          # the archives out from under a hardcoded path and the loop would
          # then prove nothing.
          target_dir=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          for crate in tributary-proto tributary-fs tributaries; do
            cargo package -p "$crate" --no-verify --allow-dirty
            archive=$(ls -1 "$target_dir"/package/"$crate"-*.crate)
            for license in LICENSE-APACHE LICENSE-MIT; do
              if ! tar tzf "$archive" | grep -qE "^$crate-[^/]+/$license\$"; then
                echo "::error::$archive ships no $license"
                exit 1
              fi
            done
            echo "$archive carries both licenses"
          done

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin --engine llvm --all-features --run-types lib --run-types tests --run-types doctests --workspace --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          # Coverage upload is advisory: a missing token or a transient upload hiccup
          # must not fail the whole CI run.
          fail_ci_if_error: false
