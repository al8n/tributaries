  # `license = "MIT OR Apache-2.0"` is a claim about the archive a consumer
  # receives, and nothing checked it: both license texts lived only at the
  # workspace root, so every packaged crate shipped with no license at all.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Package each crate and prove it carries both licenses
        # --no-verify: the members depend on each other at versions that need
        # not be published yet, and this gate is about the archive's CONTENTS.
        run: |
          set -eu
          # Asked for rather than assumed: a configured `target-dir` would move
          # the archives out from under a hardcoded path and the loop would
          # then prove nothing.
          target_dir=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          for crate in tributary-proto tributary-fs tributaries; do
            cargo package -p "$crate" --no-verify --allow-dirty
            archive=$(ls -1 "$target_dir"/package/"$crate"-*.crate)
            for license in LICENSE-APACHE LICENSE-MIT; do
              if ! tar tzf "$archive" | grep -qE "^$crate-[^/]+/$license\$"; then
                echo "::error::$archive ships no $license"
                exit 1
              fi
            done
            echo "$archive carries both licenses"
          done

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin --engine llvm --all-features --run-types lib --run-types tests --run-types doctests --workspace --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          # Coverage upload is advisory: a missing token or a transient upload hiccup
          # must not fail the whole CI run.
          fail_ci_if_error: false
