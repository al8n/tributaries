name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

# A newer commit on the same ref makes the older run's result obsolete: it can
# only ever report on code nobody will merge, while holding runner capacity the
# current commit is waiting for. Superseded runs are therefore cancelled — but
# never on the trunk, where every commit's result is a record worth keeping and
# nothing supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # Check formatting (platform-independent, one OS is enough)
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --exclude-no-default-features
    - name: Clippy featureless tributaries
      # The blanket --exclude-no-default-features above never builds the FEATURELESS
      # umbrella (the generic core: no fs, no runtime); pin it explicitly here.
      run: cargo clippy -p tributaries --no-default-features -- -D warnings

  # The advertised `rust-version` is a support claim, and every other job
  # installs the latest stable — so nothing would notice the workspace drifting
  # past its own floor. This job is that gate: pinned, never updated in place.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal --no-self-update
      - name: Assert the pin still matches the manifest
        # A raised `rust-version` against a stale pin here would leave the claim
        # ungated again, which is the hole this job exists to close.
        run: |
          declared=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["rust_version"])')
          if [ "$declared" != "1.95" ]; then
            echo "::error::workspace rust-version is $declared but this job pins 1.95"
            exit 1
          fi
      - name: Build every target at the MSRV
        run: cargo +1.95 build --workspace --all-features --all-targets
      - name: Test at the MSRV
        # The `_integration` binaries are COMPILED by the build step above but
        # not run here: they need `--test-threads=1` and privilege, and the
        # dedicated Linux jobs own them.
        run: |
          cargo +1.95 test -p tributary-proto --all-features
          cargo +1.95 test -p tributary-fs --features tokio,smol
          cargo +1.95 test -p tributaries --features fs,tokio,smol

  # A declared dependency floor is a claim too, and never an exercised one:
  # cargo resolves the NEWEST compatible version, so a floor can sit years below
  # anything that actually compiles and no job would notice. This one resolves
  # every DIRECT dependency at its declared floor and builds there.
  minimal-versions:
    name: minimal-versions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A floor is only exercised where its code COMPILES. `--all-targets`
        # widens the target kinds, not the platform: on Ubuntu the macOS-gated
        # dependencies resolve into the lockfile and are then never built, so
        # their floors could become uncompilable without this job noticing. Each
        # platform whose manifest carries its own floors therefore builds them
        # natively. The macOS runner is the added cost, and it is the only way to
        # compile a `cfg(target_os = "macos")` floor at all.
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly --no-self-update && rustup default nightly
      - name: Resolve every direct dependency at its floor
        # Cargo.lock is not committed, so this resolves from the manifests
        # alone and the lockfile it writes IS the assertion.
        run: cargo +nightly generate-lockfile -Z direct-minimal-versions
      - name: Show the floors that were selected
        run: cargo tree --depth 1 --locked
      - name: Build at the floors
        run: cargo +nightly check --workspace --all-features --all-targets --locked

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install mingw (windows-gnu)
        # windows-sys emits import libraries through the target's dlltool on
        # BOTH gnu flavors.
        if: contains(matrix.target, 'windows-gnu')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build --feature-powerset --exclude-no-default-features

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # The macOS leg runs the real-FSEvents integration suites (tributary-fs's
    # `watcher` and tributaries' unprivileged `umbrella`); a wedged kernel stream
    # must fail the job, not idle out the runner.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      # `_integration` gates the privileged, single-threaded Linux integration
      # suites (see tributary-fs/Cargo.toml); this parallel powerset run must not
      # build or run them — the `linux-integration` job owns them.
      run: cargo hack test --feature-powerset --exclude-no-default-features --exclude-features _integration
    - name: Check featureless tributaries
      # The blanket --exclude-no-default-features above never builds the FEATURELESS
      # umbrella (the generic core: no fs, no runtime); pin it explicitly here.
      run: cargo check -p tributaries --no-default-features
    - name: Test fs-off custom-source suite
      # The #20 regression pin: `indexer_shaped` binds its own Source over the
      # `tributary-fs` DEV-dependency and must compile and run with the umbrella's
      # `fs` feature OFF (its test target requires only `tokio`). The powerset above
      # covers this combo implicitly; this explicit leg keeps it from vanishing if
      # the matrix flags ever change.
      run: cargo test -p tributaries --no-default-features --features tokio --test indexer_shaped

  # Every lifecycle/cancellation/close/timer contract lives in four in-crate
  # test modules whose `cfg` names `feature = "tokio"` alone, so they compile
  # out of every Smol build: a green Smol leg of the feature powerset proves
  # nothing about Smol. This job runs those modules under Smol and ACCOUNTS for
  # how many actually executed, so the gap is annotated on every run instead of
  # passing silently, and turns into a hard failure the moment the gate widens.
  smol-contracts:
    name: smol-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-smol-contracts-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-smol-contracts-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Runtime contracts under smol
        run: |
          set -o pipefail
          cargo test -p tributary-fs --no-default-features --features smol --lib \
            -- driver::tests:: watcher::tests:: 2>&1 | tee fs.log
          cargo test -p tributaries --no-default-features --features fs,smol --lib \
            -- driver::tests:: demux::tests:: 2>&1 | tee umbrella.log
      - name: Account for what Smol actually executed
        # The activation condition names the FOUR module declarations this job is
        # about, each by file and by the attribute that must sit immediately above
        # it. A whole-tree grep for that attribute is not the same condition: the
        # same text gates dozens of unrelated helpers, so widening exactly these
        # four would leave the grep matching, the count at zero, and this job
        # reporting a gap it no longer has — forever.
        run: |
          set -eu
          executed=$(grep -ho 'test result: ok\. [0-9]\+ passed' fs.log umbrella.log \
            | awk '{ sum += $4 } END { print sum + 0 }')
          echo "runtime-contract tests executed under smol: $executed" >> "$GITHUB_STEP_SUMMARY"
          attr='#[cfg(all(test, feature = "tokio"))]'
          gated=0
          for gate in \
            'tributary-fs/src/watcher/mod.rs|mod tests;' \
            'tributary-fs/src/driver/mod.rs|mod tests;' \
            'tributaries/src/driver/mod.rs|mod tests;' \
            'tributaries/src/demux/mod.rs|mod tests;'
          do
            file=${gate%%|*}
            decl=${gate#*|}
            if [ ! -f "$file" ]; then
              echo "::error::$file is gone; this job no longer names the suites it accounts for"
              exit 1
            fi
            if awk -v attr="$attr" -v decl="$decl" \
                 'prev == attr && $0 == decl { found = 1 } { prev = $0 } END { exit !found }' \
                 "$file"; then
              gated=$((gated + 1))
            fi
          done
          if [ "$gated" -eq 4 ]; then
            echo "::warning::all four runtime-contract suites are still cfg-gated to feature = \"tokio\"; Smol executed $executed of them"
          elif [ "$executed" -eq 0 ]; then
            echo "::error::$((4 - gated)) of the four runtime-contract suites no longer gate on tokio alone, yet Smol executed no runtime-contract test"
            exit 1
          fi

  linux-integration:
    name: linux-integration
    runs-on: ubuntu-latest
    # Real-inotify convergence suites; a wedged kernel queue must fail the
    # job, not idle out the runner.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-linux-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-linux-integration-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Integration (unprivileged)
      # The privileged cells self-probe and skip loudly here. Single-threaded
      # by the suite's contract (the sysctl cells shrink namespace-global
      # inotify limits). Captured because a skip notice is written to the
      # inherited stderr precisely so it survives a GREEN run, and the
      # vacuousness gate below is the only reader it has.
      run: |
        set -o pipefail
        cargo test -p tributary-fs --all-features --test linux_inotify \
          -- --test-threads=1 --nocapture 2>&1 | tee inotify-unpriv.log
    - name: Integration (privileged)
      # sudo unlocks the sysctl overflow/watch-limit cells and the bind-mount
      # aliasing cell; the tests snapshot and restore every knob they touch.
      run: |
        set -o pipefail
        sudo -E env "PATH=$PATH" cargo test -p tributary-fs --all-features \
          --test linux_inotify -- --test-threads=1 --nocapture 2>&1 | tee inotify-priv.log
    - name: Assert neither leg was vacuous
      # A cell that prints SKIP and returns is COUNTED AS PASSING by libtest, so
      # a leg in which nothing ran still exits 0 with a healthy-looking total —
      # exactly the silent pass this job exists to prevent. An aggregate count
      # therefore proves nothing: what matters is that the specific cells a leg
      # exists to run actually ran, which is asserted by name below.
      run: |
        set -eu

        # Three cells sample a real mount or overflow cycle over SEVERAL rounds
        # and print a skip for a round whose staging did not come up, then keep
        # going. Those notices cannot hide a vacuous pass: each of the three ends
        # in an assertion over its own staged/live round count, so a run whose
        # rounds ALL missed fails the cell instead of reporting green — which
        # makes a round-scoped notice the one skip shape that carries no loss of
        # coverage. The three are named individually so a later cell cannot
        # inherit the exemption merely by adopting the wording.
        rounds='SKIP widen_over_unmount_rebind_is_never_silently_certified: round '
        rounds="$rounds"'|SKIP overflow_swallowed_unmount_rebinds_or_dies_loudly: round '
        rounds="$rounds"'|SKIP overflow_swallowed_recreate_rebinds_the_midtree_watch: round '
        # `TRIBUTARY-SKIP`, never a bare `SKIP`: under --nocapture a failing
        # cell's own panic message quotes the word while pointing a reader at
        # these lines, and a gate that matched it would fire on the report of a
        # failure rather than on a skip.
        for leg in inotify-unpriv inotify-priv; do
          grep 'TRIBUTARY-SKIP' "$leg.log" | grep -vE "$rounds" > "$leg.skips" || true
        done

        # Under privilege there is no other legal skip — no cell in this binary
        # needs privilege's ABSENCE, and nothing here is optional. Every notice
        # that survives the filter is a precondition the runner was supposed to
        # satisfy: the sysctl probe refused, a bind mount refused, mkfs.ext4 or
        # losetup missing, a loop mount refused, a kernel that stopped enforcing
        # the max_user_watches shrink. Each silently retires the cell that
        # printed it while libtest still counts it passed.
        if [ -s inotify-priv.skips ]; then
          cat inotify-priv.skips
          echo "::error::the privileged inotify leg skipped cells this runner is supposed to satisfy"
          exit 1
        fi

        # The six cells that exist only under CAP_SYS_ADMIN, each gated by the
        # suite's own `privileged_or_skip` probe.
        privileged_only='
          queue_overflow_surfaces_as_rescan
          watch_limit_exhaustion_is_honest
          bind_mount_inside_root_is_a_boundary
          widen_over_unmount_rebind_is_never_silently_certified
          overflow_swallowed_unmount_rebinds_or_dies_loudly
          overflow_swallowed_recreate_rebinds_the_midtree_watch
        '
        # Independent of any one cell's skip protocol: the two legs' identities
        # are DIFFERENT. The unprivileged leg is only unprivileged if that probe
        # refused it, so a runner whose default user gained CAP_SYS_ADMIN would
        # quietly run this job twice under privilege — leaving the probe itself,
        # which is what attributes the privileged leg's coverage to privilege,
        # never once exercised in the direction it decides.
        for cell in $privileged_only; do
          if ! grep -q "SKIP $cell: needs CAP_SYS_ADMIN" inotify-unpriv.log; then
            echo "::error::the unprivileged inotify leg ran $cell with CAP_SYS_ADMIN"
            exit 1
          fi
        done

        # A cell that ran prints its name; a cell that skipped prints SKIP beside
        # it. Both are asserted, because a cell silently compiled out of the
        # binary and a cell that ran and skipped are different defects.
        require_ran() {
          log=$1
          skips=$2
          shift 2
          missing=0
          for cell in "$@"; do
            if ! grep -q "^test $cell \.\.\." "$log"; then
              echo "::error::$log never ran $cell"
              missing=1
            elif grep -q "SKIP $cell" "$skips"; then
              grep "SKIP $cell" "$skips"
              echo "::error::$log skipped $cell"
              missing=1
            fi
          done
          return $missing
        }

        # The privileged leg owns every cell that shrinks a namespace-global
        # sysctl, builds an ext4 loopback or takes a bind mount — which is the
        # whole of why this job pays for a second run under sudo.
        require_ran inotify-priv.log inotify-priv.skips $privileged_only

        # Everything else is reachable under default caps, so the unprivileged
        # leg owns it: a regression that only shows without privilege has a leg
        # that would catch it.
        require_ran inotify-unpriv.log inotify-unpriv.skips \
          churn_converges \
          rename_pairs_into_moved \
          kernel_teardown_resolves_and_siblings_flow \
          unwatch_quiesces \
          moved_directory_keeps_coverage \
          non_utf8_name_escalates_to_rescan \
          a_degraded_cover_settles_behind_its_ordering_proof \
          close_quiesces_under_sustained_traffic \
          replace_root_widens_and_rebinds \
          a_sync_barrier_across_a_widen_resolves_by_delivery \
          a_sync_cookie_never_overtakes_a_parked_move_out \
          a_deep_widen_adopts_across_the_chain \
          a_disjoint_replace_stays_rescan_bridged \
          the_loop_fixture_refuses_a_hijackable_parent_and_anchors_its_image \
          a_watchdog_resumed_bracket_is_reported_and_never_staged \
          descriptor_renewal_keeps_the_tree_watched \
          live_exclusions_are_enforced_on_the_descending_backend \
          a_rename_out_of_an_exclusion_arms_the_newly_reportable_subtree \
          a_rename_into_an_exclusion_sheds_the_subtree_it_no_longer_reports

        # And the binary must contain the whole suite: a cell dropped by a stray
        # cfg would otherwise leave both legs green over a shrunken suite. Both
        # attribute spellings are counted — this binary carries plain `#[test]`
        # cells beside the async ones, and a count that saw only one form would
        # ratify the loss of the other.
        cells=$(grep -cE '^#\[test\]|^#\[tokio::test' tributary-fs/tests/linux_inotify.rs)
        for log in inotify-unpriv.log inotify-priv.log; do
          if ! grep -q "test result: ok\. $cells passed" "$log"; then
            grep 'test result:' "$log" || true
            echo "::error::$log did not run all $cells cells the suite declares"
            exit 1
          fi
        done

  # The fanotify backend had no hosted acceptance at all: the powerset `test`
  # job excludes `_integration`, and `linux-integration` names only the inotify
  # binary, so `linux_fanotify` was built and run nowhere.
  linux-fanotify:
    name: linux-fanotify
    runs-on: ubuntu-latest
    # Real-fanotify convergence suites over an ext4 loopback; a wedged kernel
    # queue must fail the job, not idle out the runner.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-linux-fanotify-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-linux-fanotify-
          ${{ runner.os }}-linux-integration-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Prove fanotify can arm an ext4 loopback here
      # Every privileged cell builds an ext4 loopback and self-skips loudly if it
      # cannot. Proving the runner supports one BEFORE the suite runs turns an
      # image that lost loop devices into a named environment failure rather than
      # a green run in which nothing was tested.
      #
      # A mounted filesystem is not the precondition, though — ARMING it is. The
      # probe therefore performs the same three kernel operations the spawn
      # barrier does, against the same superblock: the composite `fanotify_init`,
      # the `FAN_MARK_FILESYSTEM` mark, and the `name_to_handle_at` encode the FID
      # decoding rests on. Any of them refusing names the syscall and its errno
      # here, instead of surfacing later as every loopback cell self-skipping.
      run: |
        set -eux
        img="$RUNNER_TEMP/loopback-probe.img"
        mnt="$RUNNER_TEMP/loopback-probe"
        dd if=/dev/zero of="$img" bs=1M count=16
        mkfs.ext4 -q -F "$img"
        mkdir -p "$mnt"
        sudo mount -o loop "$img" "$mnt"
        mountpoint -q "$mnt"
        cat > "$RUNNER_TEMP/fanotify-arm.c" <<'PROBE'
        #define _GNU_SOURCE
        #include <errno.h>
        #include <fcntl.h>
        #include <stdio.h>
        #include <string.h>
        #include <sys/fanotify.h>

        /* Restated numerically rather than by header name: an older glibc header
           missing one of these would otherwise drop it silently and the probe
           would prove less than the backend needs.
             init: FAN_CLASS_NOTIF | FAN_REPORT_FID | FAN_REPORT_DIR_FID
                   | FAN_REPORT_NAME | FAN_REPORT_TARGET_FID
             mark: FAN_MARK_ADD | FAN_MARK_FILESYSTEM
             mask: CREATE DELETE MODIFY ATTRIB RENAME DELETE_SELF MOVE_SELF ONDIR */
        #define INIT_FLAGS 0x1e00u
        #define MARK_FLAGS 0x0101u
        #define MARK_MASK 0x50000f06ull

        int main(int argc, char **argv) {
          if (argc != 2) {
            fprintf(stderr, "usage: %s <mount>\n", argv[0]);
            return 2;
          }
          int fd = fanotify_init(INIT_FLAGS, 0);
          if (fd < 0) {
            fprintf(stderr, "fanotify_init: %s\n", strerror(errno));
            return 1;
          }
          if (fanotify_mark(fd, MARK_FLAGS, MARK_MASK, AT_FDCWD, argv[1]) != 0) {
            fprintf(stderr, "fanotify_mark FILESYSTEM %s: %s\n", argv[1], strerror(errno));
            return 1;
          }
          struct {
            struct file_handle handle;
            unsigned char space[128];
          } fh;
          fh.handle.handle_bytes = sizeof fh.space;
          int mount_id = 0;
          if (name_to_handle_at(AT_FDCWD, argv[1], &fh.handle, &mount_id, 0) != 0) {
            fprintf(stderr, "name_to_handle_at %s: %s\n", argv[1], strerror(errno));
            return 1;
          }
          return 0;
        }
        PROBE
        cc -O0 -o "$RUNNER_TEMP/fanotify-arm" "$RUNNER_TEMP/fanotify-arm.c"
        sudo "$RUNNER_TEMP/fanotify-arm" "$mnt"
        sudo umount "$mnt"
        rm -f "$img"
    - name: Fanotify (unprivileged)
      # Default caps: the loopback cells skip here, but the Auto-probe FALLBACK
      # arm and the forced-Fanotify-without-privilege typed error are reachable
      # ONLY without CAP_SYS_ADMIN. Single-threaded by the suite's contract (the
      # cells mount and unmount a shared loopback).
      run: |
        set -o pipefail
        cargo test -p tributary-fs --all-features --test linux_fanotify \
          -- --test-threads=1 --nocapture 2>&1 | tee fanotify-unpriv.log
    - name: Fanotify (privileged)
      # sudo unlocks CAP_SYS_ADMIN and the ext4 loopback, which is what makes
      # the FID/identity, rename-pairing, superblock-filter and unmount-quiesce
      # cells run at all.
      run: |
        set -o pipefail
        sudo -E env "PATH=$PATH" cargo test -p tributary-fs --all-features \
          --test linux_fanotify -- --test-threads=1 --nocapture 2>&1 | tee fanotify-priv.log
    - name: Assert neither leg was vacuous
      # A cell that prints SKIP and returns is COUNTED AS PASSING by libtest, so
      # a leg in which nothing ran still exits 0 with a healthy-looking total —
      # exactly the silent pass this job exists to prevent. An aggregate count
      # therefore proves nothing: what matters is that the specific cells a leg
      # exists to run actually ran, which is asserted by name below.
      run: |
        set -eu

        # Under privilege the ONLY legal skips are the cells that need privilege's
        # ABSENCE (a root with CAP_DAC_OVERRIDE reads a chmod 000 directory, so the
        # walk-incompleteness they force cannot arise). Every other skip is a cell
        # the runner was supposed to satisfy — a lost loopback, a refused mount, a
        # fanotify that stopped arming — and none of them may pass quietly.
        privileged_absence='SKIP forced_fanotify_without_privilege_is_typed_error|SKIP auto_falls_back_to_inotify_on_unwalkable_subtree|SKIP forced_fanotify_typed_error_on_unwalkable_subtree'
        if grep 'SKIP' fanotify-priv.log | grep -vE "$privileged_absence"; then
          echo "::error::the privileged fanotify leg skipped cells this runner is supposed to satisfy"
          exit 1
        fi
        # Independent of any one cell's skip protocol: the leg's identity itself.
        if grep -q 'has CAP_SYS_ADMIN' fanotify-unpriv.log; then
          echo "::error::the unprivileged fanotify leg ran with CAP_SYS_ADMIN"
          exit 1
        fi

        # A cell that ran prints its name; a cell that skipped prints SKIP beside
        # it. Both are asserted, because a cell silently compiled out of the
        # binary and a cell that ran and skipped are different defects.
        require_ran() {
          log=$1
          shift
          missing=0
          for cell in "$@"; do
            if ! grep -q "^test $cell \.\.\." "$log"; then
              echo "::error::$log never ran $cell"
              missing=1
            elif grep -q "SKIP $cell" "$log"; then
              grep "SKIP $cell" "$log"
              echo "::error::$log skipped $cell"
              missing=1
            fi
          done
          return $missing
        }

        # The privileged leg is the one that owns the ext4 loopback, so it owns
        # every cell whose subject is FID decoding, rename pairing, superblock
        # scoping, mount lifetime or the admission boundary.
        require_ran fanotify-priv.log \
          fid_decode_and_identity_roundtrip \
          rename_pairs_into_one_moved \
          dir_rename_reparents_descendant_paths \
          move_in_populated_dir_delivers_descendant_events \
          burst_move_in_then_reparent_is_coverage_honest \
          move_out_populated_dir_stops_descendant_events \
          superblock_firehose_is_filtered \
          in_root_symlink_to_outside_dir_is_never_admitted \
          racing_swap_to_outside_dir_never_admits_foreign_subtree \
          racing_root_path_swap_never_goes_live_listening_elsewhere \
          racing_root_replacement_never_reseeds_onto_the_replacement \
          racing_moved_in_replacement_is_coverage_honest \
          unmount_under_watch_quiesces_without_panic \
          unmount_under_live_watch_dies_via_refresh \
          bind_mount_of_outside_dir_is_a_boundary \
          ancestor_self_bind_cycle_terminates \
          close_quiesces_under_sustained_traffic \
          replace_root_swaps_the_mark_and_repoints_stats \
          forced_fanotify_typed_error_under_a_zero_directory_cap \
          selection_matrix_auto_self_probes \
          auto_falls_back_to_inotify_under_a_zero_directory_cap \
          file_churn_keeps_a_bounded_map

        # The unprivileged leg exists for the arms privilege makes UNREACHABLE:
        # the Auto probe failing over to inotify, and forced fanotify refusing
        # with a typed error instead of starting.
        require_ran fanotify-unpriv.log \
          forced_fanotify_without_privilege_is_typed_error \
          auto_falls_back_to_inotify_on_unwalkable_subtree \
          auto_falls_back_to_inotify_under_a_zero_directory_cap \
          selection_matrix_auto_self_probes \
          file_churn_keeps_a_bounded_map

        # And the binary must contain the whole suite: a cell dropped by a stray
        # cfg would otherwise leave both legs green over a shrunken suite.
        cells=$(grep -c '^#\[tokio::test\]' tributary-fs/tests/linux_fanotify.rs)
        for log in fanotify-unpriv.log fanotify-priv.log; do
          if ! grep -q "test result: ok\. $cells passed" "$log"; then
            grep 'test result:' "$log" || true
            echo "::error::$log did not run all $cells cells the suite declares"
            exit 1
          fi
        done

  windows-integration:
    name: windows-integration
    strategy:
      fail-fast: false
      matrix:
        os:
          # Pinned labels: windows-latest re-points across image migrations,
          # and the integration matrix is exactly the support claim.
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    # Real-RDCW suites; a wedged completion port must fail the job, not idle
    # out the runner.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.os }}-windows-integration-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.os }}-windows-integration-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Build the volume zoo
      run: pwsh ci/windows/zoo.ps1 -Root "$env:RUNNER_TEMP\zoo"
    - name: Integration
      # Single-threaded by the suite's contract (root-death and overflow
      # cells own their scratch trees; serialization keeps kernel-buffer
      # pressure deterministic).
      run: cargo test -p tributary-fs --all-features --test windows_rdcw -- --test-threads=1

  sanitizer:
    name: sanitizer-${{ matrix.which }}
    strategy:
      fail-fast: false
      matrix:
        which: [asan-lsan, msan, tsan]
        # TSan's stop-the-world instrumentation slows the runtime far more than
        # ASan/LSan/MSan, so its real-kernel timing cells (notably the
        # cross-directory move-pairing) need a larger budget than the shared
        # default to stay honest rather than flaky.
        include:
          - which: tsan
            timing_scale: 12
    runs-on: ubuntu-latest
    # A passing shard finishes in a few minutes; this bounds a pathological
    # livelock (a producer/drain cell under TSan's adversarial scheduling) to a
    # fast failure instead of the 6 h GitHub job ceiling.
    timeout-minutes: 45
    env:
      # The storm cells converge statistically over many seeds; under sanitizer
      # instrumentation the full 64-seed sweep dominates the job's runtime. The
      # sanitizers are here to find memory/thread errors, and a few seeds drive the
      # same code paths — the full sweep still runs on the native `test` legs.
      TRIBUTARY_FS_STORM_SEEDS: 8
      # The real-kernel cells' budgets are sized for native speed; sanitizer
      # instrumentation slows the runtime several fold while the producer's raw
      # syscalls keep their pace, so the kernel-event waits and the move-pairing
      # window need proportionally more room to stay honest rather than flaky.
      # TSan is the slowest instrument, so it takes a larger scale (see the
      # matrix `include`); the others use the shared default.
      TRIBUTARY_FS_TIMING_SCALE: ${{ matrix.timing_scale || 6 }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Sanitizer (${{ matrix.which }})
        run: bash ci/sanitizer.sh "${{ matrix.which }}"

  miri-tb:
    name: miri-tb-${{ matrix.target }}${{ matrix.test-group && format(' [{0}]', matrix.test-group) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Every target runs the same seven-way partition, one shard per job. The
        # partition is disjoint and exhaustive over every workspace test, so the
        # shards together are exactly the single unsharded pass they replace.
        #
        # Sharding is not only about the 32-bit address space that forced it: an
        # emulated target interprets every instruction, so one process over the
        # whole workspace is long enough that a single late failure costs the whole
        # run's feedback. Uniform shards keep each job short, name the failing
        # region in the job title, and stop any one target from quietly growing
        # past a limit the others already hit.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - aarch64-apple-darwin
        test-group:
          - rest
          - proto-monitor-head
          - proto-monitor-tail
          - fs-rest
          - fs-cookie
          - fs-descending
          - fs-driver
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    # Sized from the shards themselves, not from the 6 h default a job inherits
    # by saying nothing. All seven interpreted on one host, tree borrows then
    # stacked: `fs-descending` ~38/~24 min for 93 cells, `fs-rest` ~33/~20 for
    # 684, `rest` ~28/~23 for 229, `proto-monitor-head` ~18/~12 for 219,
    # `fs-driver` ~17/~10 for 75, `proto-monitor-tail` ~11/~8 for 146,
    # `fs-cookie` ~8/~6 for 76. Tree borrows costs 1.2-1.7x its stacked
    # counterpart and reorders the middle of the table, so the bound is sized
    # from it; both jobs share it because both run this same matrix. Add the
    # toolchain install, `cargo miri setup` and a cold build, and even the
    # longest tree-borrows job lands inside an hour, which leaves headroom for
    # a slow runner or a cache miss. What it buys is the failure mode: a shard
    # that wedges — the one thing an interpreter makes easy, since a cell can
    # spin without ever being wrong — now reports in 90 minutes instead of
    # burning six hours of a concurrency slot before anyone hears about it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_tb.sh "${{ matrix.target }}" "${{ matrix.test-group }}"

  miri-sb:
