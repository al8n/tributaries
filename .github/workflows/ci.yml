          - target: powerpc64-unknown-linux-gnu
            os: ubuntu-latest
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    # Sized from the shards themselves, not from the 6 h default a job inherits
    # by saying nothing. All seven interpreted on one host, tree borrows then
    # stacked: `fs-descending` ~38/~24 min for 93 cells, `fs-rest` ~33/~20 for
    # 684, `rest` ~28/~23 for 229, `proto-monitor-head` ~18/~12 for 219,
    # `fs-driver` ~17/~10 for 75, `proto-monitor-tail` ~11/~8 for 146,
    # `fs-cookie` ~8/~6 for 76. Tree borrows costs 1.2-1.7x its stacked
