name: loc 

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  workflow_dispatch:

# A newer commit on the same ref makes the older run's result obsolete: it can
# only ever report on code nobody will merge, while holding runner capacity the
# current commit is waiting for. Superseded runs are therefore cancelled — but
# never on the trunk, where every commit's result is a record worth keeping and
# nothing supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  loc:
    runs-on: ubuntu-latest
    # Mapped to an env var so the upload step's `if:` can gate on it — the `secrets`
    # context is not available in `if:` conditions.
    env:
      GIST_PAT: ${{ secrets.GIST_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup component add clippy
          rustup component add rustfmt
      
      - name: Install tokeit
        run: |
          cargo install tokeit --force
      
      - name: Count lines of code (workspace total + each crate)
        run: |
          set -euo pipefail
          tokeit --lang rust
          mv tokeit.json loc-tributaries.json
          # The umbrella crate's badge shows the workspace total, so only the two
          # non-umbrella crates need a count of their own.
          for c in tributary-fs tributary-proto; do
            ( cd "$c" && tokeit --lang rust )
            mv "$c/tokeit.json" "loc-$c.json"
          done

      - name: Upload all loc to the gist in one request
        # Skipped on forks / when the gist token is not configured, so the run does
        # not fail on a missing secret.
        if: ${{ env.GIST_PAT != '' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.GIST_PAT }}
          script: |
            const fs = require('fs');
            const gistId = '327b2a8aef9003246e45c6e47fe63937';
            // Gist file `tributaries` is the workspace total (which is also what the
            // umbrella crate's badge shows); the rest are per-crate. These names
            // match the LoC badge URLs in the READMEs (…/raw/<name>). The gists API
            // accepts every file in one PATCH, so one request avoids the per-crate
            // rate-limit storm.
            const crates = ['tributary-fs', 'tributary-proto'];
            const files = {
              tributaries: { content: fs.readFileSync('loc-tributaries.json', 'utf8') },
            };
            for (const c of crates) {
              files[c] = { content: fs.readFileSync(`loc-${c}.json`, 'utf8') };
            }
            await github.rest.gists.update({ gist_id: gistId, files });
            console.log('Gist updated');
