[package]
name = "tributary-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributary-fs"
description = "Async, runtime-agnostic filesystem watcher over the tributary-proto Sans-I/O core, with inotify, fanotify, FSEvents, ReadDirectoryChangesW and USN journal backends."
categories = ["filesystem", "asynchronous", "os::linux-apis", "os::macos-apis", "os::windows-apis"]
keywords = ["filesystem", "notify", "inotify", "fsevents", "watcher"]

[features]
tokio = ["agnostic-lite/tokio"]
smol = ["agnostic-lite/smol"]
# The sync BARRIER — `Watcher::{mint_sync_ticket, sync_root, request_cancel_sync,
# request_remove_cookie}`, `SyncTicket`, `SyncAdmission`, `SyncRootDenied`,
# `SyncRootError`, and the driver's whole cookie ledger beneath them.
# EXPERIMENTAL and off by default: with it off no obligation is ever created, so the
# driver stands no retirement, no domination `Rescan`, no claim and no cookie write,
# and every other surface behaves exactly as it does with the feature on. The reserved
# cookie namespace stays reserved with the feature off: a marker written by another
# watcher on the same tree is still suppressed from every consumer stream and exempt
# from the prune seats, because the namespace belongs to the barrier of ANY watcher,
# not to this build's.
#
# The two dependencies it takes are the ONE mechanism that makes a marker leaf
# unguessable: `rand_chacha` is the per-watcher nonce stream and `getrandom` the
# single 32-byte OS seed that starts it. Neither has a reader outside the barrier,
# so neither is compiled into a build that does not ask for it. `getrandom` is
# declared only in the non-wasm target table, so on `wasm32-unknown-unknown` this
# feature enables `rand_chacha` alone and the watcher holds no generator — the
# same answer that target has always given.
sync = ["dep:rand_chacha", "dep:getrandom"]
# Optional `serde` face on the configuration households (`WatcherOptions`,
# `Backend`, and the re-exported `Interest`). Off by default; `Duration` knobs
# read and write as humantime text ("10ms", "2s").
serde = ["dep:serde", "dep:humantime", "dep:humantime-serde", "tributary-proto/serde"]
# Optional `clap` face on the same households: `WatcherOptions` becomes a
# `clap::Args` group and `Backend` a `clap::ValueEnum`.
clap = ["dep:clap", "dep:humantime", "tributary-proto/clap"]
# Internal, not public API: gates the privileged real-kernel Linux integration
# test binaries (`linux_inotify`, `linux_fanotify`), whose sysctl cells shrink
# namespace-global inotify limits and so REQUIRE `--test-threads=1`. The generic
# `test` job runs the feature powerset in parallel, which those cells cannot
# tolerate, so it excludes this feature; the dedicated `linux-integration` job
# enables it (via `--all-features`) and runs them single-threaded.
#
# It also gates the test-only items a DEPENDENT crate's tests need to reach.
# `cfg(test)` does not apply to this crate when it is compiled as a dependency, so
# anything the `tributaries` umbrella's own cells must call (the reader's rebuild-
# threshold override, the USN premise types, `Event::from_change_under_root`) is
# gated on `any(test, feature = "_integration")` instead. The umbrella enables the
# feature on its DEV-dependency, so those items stay out of the library an ordinary
# dependent compiles.
_integration = []

[dependencies]
agnostic-lite = { version = "0.7", features = ["time"] }
async-channel = "2"
futures-channel = "0.3.31"
futures-core = "0.3.31"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await-macro",
] }
# A sync marker's whole integrity rests on a leaf no co-user of the tree can
# predict (see `Watcher::mint_sync_ticket`). ChaCha20 is a cryptographic stream
# cipher, so a watcher that seeds one from the OS at construction mints every
# later nonce as arithmetic, and publishing those words as file names still
# reveals nothing about the seed behind them. Pure computation with no OS
# dependency, so — unlike `getrandom` below — it needs no target gate and builds
# for `wasm32-unknown-unknown` unchanged.
rand_chacha = { version = "0.9", optional = true }
thiserror = "2"
# `glob` is enabled unconditionally: the per-root `prune` / `include` seats are
# part of this crate's API, not an optional face.
tributary-proto = { version = "0.2", path = "../tributary-proto", features = [
  "glob",
] }

# The `Duration` knobs' text form, shared by both faces: `humantime-serde` is the
# serde adapter, `humantime` the `value_parser` the clap flags take.
# `string` lets a flag default be an OWNED string, which is how the `--<duration>`
# defaults are rendered from the `DEFAULT_*` constants themselves rather than
# retyped as literals that could drift from them.
clap = { version = "4", optional = true, features = ["derive", "string"] }
humantime = { version = "2", optional = true }
humantime-serde = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

# The ONE place an OS entropy source is consulted: the 32-byte seed for the
# marker-nonce generator above, taken once when a watcher is built and never
# again. Gated off `wasm32-unknown-unknown`, which has no entropy source of its
# own — the backend there is the embedder's choice, and forcing one on a
# library's dependents is not this crate's call. Absent it a watcher holds no
# generator and mints no admission at all, rather than handing out a leaf
# something else can compute.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.30", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "test-util",
  "time",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The watch-limit integration cell probes, via a private inotify fd, whether the
# kernel actually enforces the `max_user_watches` shrink — some containerized
# kernels accept (and echo back) the write yet never charge watches against it.
libc = "0.2.183"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.183"
# `fs` covers inotify + openat + statfs/fstatfs + stat/statat; `event` covers
# eventfd + poll; `std` gives the OwnedFd / io::Error bridges. The backends
# never call rustix's pipe/mount/process surfaces (the mountinfo seed is a
# plain `/proc` read), so those features stay off.
rustix = { version = "1.1.3", default-features = false, features = ["fs", "event", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
libc = "0.2.183"
objc2-core-foundation = { version = "0.3.1", default-features = false, features = [
  "std",
  "CFArray",
  "CFBase",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFUUID",
] }
objc2-core-services = { version = "0.3", default-features = false, features = [
  "std",
  "FSEvents",
  "dispatch2",
  "libc",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Foundation: handles + error codes; Storage_FileSystem: CreateFileW,
# ReadDirectoryChangesW/ExW, handle-info queries, drive-type probes;
# System_IO: OVERLAPPED + the completion-port calls (the pump's wait/wake).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # CreateFileW's signature names SECURITY_ATTRIBUTES, so windows-sys gates
  # the function itself behind the security feature.
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  # Wdk_Storage_FileSystem: `NtCreateFile` and its FILE_CREATE /
  # FILE_DIRECTORY_FILE / FILE_SYNCHRONOUS_IO_NONALERT constants — the atomic
  # create-and-open the cookie directory is minted by (CreateDirectoryW returns
  # no handle). It also carries the notify filter bits Win32 does not re-export
  # (extended attributes, the named-stream trio), which the ABI pin in
  # `os::windows::ffi` compares the backend's own literals against.
  "Wdk_Storage_FileSystem",
  # Wdk_Foundation: `OBJECT_ATTRIBUTES`, which is how that create is anchored to
  # a parent HANDLE and a leaf name instead of to a path.
  "Wdk_Foundation",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
rustdoc-args = ["--cfg", "docsrs"]

# The privileged real-kernel Linux integration suites are gated behind the
# internal `_integration` feature (see [features]) so the generic parallel
# `test` job skips them; they run single-threaded in the `linux-integration`
# job. `watcher` (macOS FSEvents) stays auto-discovered and parallel-safe.
[[test]]
name = "linux_inotify"
required-features = ["_integration"]

[[test]]
name = "linux_fanotify"
required-features = ["_integration"]

[[test]]
name = "windows_rdcw"
required-features = ["_integration"]
