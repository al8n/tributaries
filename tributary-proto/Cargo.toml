[package]
name = "tributary-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributary-proto"
description = "Sans-I/O state machine for filesystem notification: a primitive-agnostic watch tree, move normalization, and overflow recovery with no I/O of its own."
categories = ["filesystem", "asynchronous", "no-std"]
keywords = ["filesystem", "notify", "sans-io", "no-std", "watcher"]

[features]
default = ["std"]
std = ["serde?/std"]
# Optional `serde` face on the crate's configuration vocabulary (`Interest`).
# Off by default; `no_std` builds keep it (serde's derive needs neither `std`
# nor `alloc` for the bool struct it faces).
serde = ["dep:serde"]
# Optional `clap` face on the same vocabulary — `Interest` becomes a
# `clap::Args` group. clap itself is std-only, so the face implies `std`.
clap = ["dep:clap", "std"]
# The `glob` vocabulary (`Glob`, `Globs`): validated root-relative patterns and
# the compiled sets the watcher's per-root seats match with. `globset` needs
# `std`, so the face implies it. `unicode-normalization` folds both a pattern and
# a candidate path to NFC, so a name spelled composed matches one the filesystem
# spells decomposed.
glob = ["dep:globset", "dep:unicode-normalization", "std"]

[dependencies]
globset = { version = "0.4", optional = true }
unicode-normalization = { version = "0.1", optional = true }
clap = { version = "4", optional = true, default-features = false, features = [
  "std",
  "derive",
] }
serde = { version = "1", optional = true, default-features = false, features = [
  "derive",
] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
