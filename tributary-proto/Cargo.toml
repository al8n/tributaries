[package]
name = "tributary-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributary-proto"
description = "Pure Sans-I/O state machine (the brain) for the tributaries filesystem-notification stack."
