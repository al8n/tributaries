[package]
name = "tributary-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributary-proto"
description = "Sans-I/O state machine for filesystem notification: a primitive-agnostic watch tree, move normalization, and overflow recovery with no I/O of its own."
categories = ["filesystem", "asynchronous", "no-std"]
keywords = ["filesystem", "notify", "sans-io", "no-std", "watcher"]

[features]
default = ["std"]
std = []

[dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
