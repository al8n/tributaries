[package]
name = "tributary-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributary-proto"
description = "Sans-I/O state machine for filesystem notification: a primitive-agnostic watch tree, move normalization, and overflow recovery with no I/O of its own."
categories = ["filesystem", "asynchronous", "no-std"]
keywords = ["filesystem", "notify", "sans-io", "no-std", "watcher"]

[features]
default = ["std"]
std = ["serde?/std"]
# Optional `serde` face on the crate's configuration vocabulary (`Interest`).
# Off by default; `no_std` builds keep it (serde's derive needs neither `std`
# nor `alloc` for the bool struct it faces).
serde = ["dep:serde"]
# Optional `clap` face on the same vocabulary — `Interest` becomes a
# `clap::Args` group. clap itself is std-only, so the face implies `std`.
clap = ["dep:clap", "std"]

[dependencies]
# Floors, not decoration: the `minimal-versions` job resolves every DIRECT
# requirement to its lowest match and builds there. `serde` must be at least the
# generation its own derive emits against (`serde_derive` is transitive, so it is
# NOT minimized and arrives newest — 1.0.0 against derive 1.0.229 is the failure
# this pins out). `clap` 4.2 is where `Option<T>` in `#[command(flatten)]` landed,
# which the opt-in debounce group rests on.
clap = { version = "4.2", optional = true, default-features = false, features = [
  "std",
  "derive",
] }
serde = { version = "1.0.229", optional = true, default-features = false, features = [
  "derive",
] }

[dev-dependencies]
# The floor the `json!` macro is usable from a 2018+ edition caller at
# (1.0.10 still fails to resolve `json_internal!`).
serde_json = "1.0.25"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
