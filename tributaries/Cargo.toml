[package]
name = "tributaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributaries"
description = "The public top-level crate of the tributaries stack: subsumes overlapping watch subscriptions into the disjoint roots tributary-fs requires, and attributes each event back to every covering subscription."
categories = ["filesystem", "asynchronous"]
keywords = ["filesystem", "notify", "watcher", "subsume"]

[features]
# Runtime aliases mirror `tributary-fs`. The sans-I/O engines need no runtime;
# these gate the async driver's `Tokio*`/`Smol*` aliases.
tokio = ["tributary-fs/tokio", "agnostic-lite/tokio"]
smol = ["tributary-fs/smol", "agnostic-lite/smol"]

[dependencies]
agnostic-lite = { version = "0.6", features = ["time"] }
arc-swap = "1"
async-channel = "2"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await-macro",
] }
iradix = "0.3"
thiserror = "2"
tributary-fs = { version = "0.1", path = "../tributary-fs" }
tributary-proto = { version = "0.1", path = "../tributary-proto" }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
