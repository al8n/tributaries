[package]
name = "tributaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/al8n/tributaries"
documentation = "https://docs.rs/tributaries"
description = "Cross-platform filesystem notification: overlapping watch subscriptions are subsumed into disjoint roots, and every event is attributed back to each subscription covering it."
categories = ["filesystem", "asynchronous"]
keywords = ["filesystem", "notify", "watcher", "fsevents", "inotify"]

[features]
default = ["fs"]
# The default local-filesystem binding (`FsSource`, the `RootHandle`/`WatcherOptions`
# re-exports, the pure-fs constructor and runtime aliases). Off, the crate is the
# generic core over `tributary-proto` alone — a custom-`Source` consumer skips the
# whole fs stack.
fs = ["dep:tributary-fs"]
# Runtime features are orthogonal to `fs`: they gate the async driver's
# `Tokio*`/`Smol*` aliases and forward the runtime into `tributary-fs` only when the
# fs binding is enabled too (the weak `?` dependency). The sans-I/O engines need no
# runtime.
tokio = ["agnostic-lite/tokio", "tributary-fs?/tokio"]
smol = ["agnostic-lite/smol", "tributary-fs?/smol"]

[dependencies]
agnostic-lite = { version = "0.7", features = ["time"] }
arc-swap = "1"
async-channel = "2"
futures-channel = "0.3.31"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await-macro",
] }
iradix = "0.3"
# The barrier's integrity rests on a cookie name a co-user cannot predict (see
# `SyncToken`). ChaCha20 is a cryptographic stream cipher, so a driver that seeds one
# from the OS at construction mints every later nonce as arithmetic, and publishing those
# words in cookie file names still reveals nothing about the seed behind them. Pure
# computation with no OS dependency, so — unlike `getrandom` below — it needs no target
# gate and builds for `wasm32-unknown-unknown` unchanged.
rand_chacha = "0.9"
thiserror = "2"
tributary-fs = { version = "0.1", path = "../tributary-fs", optional = true }
tributary-proto = { version = "0.1", path = "../tributary-proto" }

# The ONE place an OS entropy source is consulted: the 32-byte seed for the cookie-nonce
# generator above, taken once when a driver is assembled and never again. Gated off
# `wasm32-unknown-unknown`, which has no entropy source of its own — the backend there is
# the embedder's choice, and forcing one on a library's dependents is not this crate's
# call. Absent it a driver holds no generator and refuses every barrier outright, rather
# than running on a name something else can compute.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.3"

[dev-dependencies]
# Mirror a real consumer's manifest: the indexer-shaped integration suite
# (`tests/indexer_shaped.rs`) names `tributary_fs::Watcher` + a concrete
# `agnostic_lite` runtime directly, exactly as a downstream crate building its own
# `Source` would — with this crate's own `fs` feature OFF, so the dev-dependency is
# unconditional and carries its own `tokio` layer (the weak `tributary-fs?/tokio`
# forwarding above deliberately does not fire when `fs` is off).
#
# `_integration` is `tributary-fs`'s internal test-only gate. It is enabled HERE, on the
# dev-dependency, because the fs-binding cell mints its lower-layer input through that
# crate's `Event::from_change_under_root` seam, which lives behind the gate. Features of a
# dev-dependency are not unified into a plain `cargo build` of this crate, so the seam stays
# out of the library any dependent compiles: it reaches this crate only while its own tests
# are being built.
agnostic-lite = { version = "0.7", features = ["time"] }
proptest = "1"
tempfile = "3"
tributary-fs = { version = "0.1", path = "../tributary-fs", features = [
  "tokio",
  "_integration",
] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.30", features = ["macros", "rt-multi-thread", "time", "test-util"] }

# The pure-fs end-to-end suite needs the default fs binding and a runtime.
[[test]]
name = "umbrella"
required-features = ["fs", "tokio"]

# The custom-source proof: it binds its own `Source` over the `tributary-fs`
# DEV-dependency, so it deliberately does NOT require `fs` — it must keep compiling
# and running with the umbrella's fs feature off.
[[test]]
name = "indexer_shaped"
required-features = ["tokio"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
